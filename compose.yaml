x-app-service: &app-service
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  env_file: [.env, .env.docker]
  environment: &low-memory-python
    MALLOC_ARENA_MAX: "2"
    OPENBLAS_NUM_THREADS: "1"
    OMP_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    NUMEXPR_NUM_THREADS: "1"
    ARROW_IO_THREADS: "1"
    SEARXNG_BASE_URL: "http://searxng:8080"
    PRIVATE_OBJECT_ROOT: "/data/private"
  extra_hosts: ["host.docker.internal:host-gateway"]
  volumes:
    - lake-data:/data/lake
    - object-data:/data/objects
    - private-data:/data/private
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  logging: &bounded-logs
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Optional public HTTPS edge. It is intentionally profile-gated so the
  # default local stack stays loopback-only and existing external proxies keep
  # working unchanged.
  edge-gateway:
    profiles: ["edge"]
    build:
      context: .
      dockerfile: docker/edge-gateway.Dockerfile
    environment:
      EDGE_DOMAIN: "${EDGE_DOMAIN:-}"
      EDGE_ACME_EMAIL: "${EDGE_ACME_EMAIL:-}"
      EDGE_ACME_CA_SERVER: "${EDGE_ACME_CA_SERVER:-letsencrypt}"
      EDGE_FRPC_ENABLED: "${EDGE_FRPC_ENABLED:-false}"
    volumes:
      - edge-acme-data:/var/lib/acme
      - edge-certificates:/etc/edge/certs
      - "${EDGE_FRPC_CONFIG_FILE:-./docker/edge-gateway/frpc.disabled.toml}:/etc/edge/frpc.toml:ro"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=12m
      # acme.sh and the HTTP challenge location need a writable directory even
      # though the rest of the gateway filesystem remains read-only.
      - /var/lib/acme-webroot:rw,noexec,nosuid,size=4m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE", "SETUID", "SETGID", "CHOWN"]
    pids_limit: 128
    mem_limit: 96m
    logging: *bounded-logs
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && pidof nginx >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5

  private-data-init:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["chown -R 10001:10001 /data/private"]
    volumes: ["private-data:/data/private"]
    restart: "no"
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports: ["${WEB_BIND_ADDRESS:-127.0.0.1}:80:80"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 32m
    logging: *bounded-logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5

  api:
    <<: *app-service
    command: ["sh", "-c", "ashare-ai migrate && ashare-ai api --host 0.0.0.0 --port 8000"]
    ports: ["${API_BIND_ADDRESS:-127.0.0.1}:8000:8000"]
    mem_limit: 384m
    depends_on:
      private-data-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Default low-memory worker. It polls all configured queues serially and runs each
  # heavy job in an isolated child process so completed heaps return to the OS.
  job-worker:
    <<: *app-service
    command: ["python", "-m", "ashare_ai.orchestration.serial_worker"]
    mem_limit: 700m
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; from ashare_ai.core.config import get_settings; assert redis.Redis.from_url(get_settings().redis_url).ping()"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Legacy optional scheduler/queue workers remain profile-gated.  The normal
  # deployment topology is the serial job-worker; the two research workers
  # below are only enabled by the persisted DUAL topology command.
  worker:
    <<: *app-service
    profiles: ["parallel-workers"]
    command: ["python", "-m", "ashare_ai.orchestration.runner"]
    mem_limit: 256m
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; from ashare_ai.core.config import get_settings; assert redis.Redis.from_url(get_settings().redis_url).ping()"]
      interval: 30s
      timeout: 5s
      retries: 5

  backtest-worker:
    <<: *app-service
    profiles: ["parallel-workers"]
    command: ["python", "-m", "ashare_ai.orchestration.backtest_worker"]
    mem_limit: 700m
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  research-worker:
    <<: *app-service
    # This profile is deliberately opt-in.  SERIAL deployments do not create
    # research-worker containers; the System Settings restart command enables
    # it only after the persisted topology is changed to DUAL.
    profiles: ["dual-research"]
    scale: 2
    command: ["python", "-m", "ashare_ai.orchestration.research_worker"]
    mem_limit: 700m
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; from ashare_ai.core.config import get_settings; assert redis.Redis.from_url(get_settings().redis_url).ping()"]
      interval: 30s
      timeout: 5s
      retries: 5

  trade-plan-worker:
    <<: *app-service
    profiles: ["parallel-workers"]
    command: ["python", "-m", "ashare_ai.orchestration.trade_plan_worker"]
    mem_limit: 700m
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  exit-advice-worker:
    <<: *app-service
    command: ["python", "-m", "ashare_ai.orchestration.exit_advice_worker"]
    mem_limit: 320m
    pids_limit: 64
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; from ashare_ai.core.config import get_settings; assert redis.Redis.from_url(get_settings().redis_url).ping()"]
      interval: 30s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng@sha256:800a5e3757df04f59e6bd6c622f15de2edbfa47f5591c5b82d4a8ff3b938a845
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
      SEARXNG_SETTINGS_PATH: "/etc/searxng/settings.yml"
      GRANIAN_BLOCKING_THREADS: "2"
      GRANIAN_RUNTIME_THREADS: "1"
      MALLOC_ARENA_MAX: "2"
    volumes:
      - ./docker/searxng-settings.yml:/etc/searxng/settings.yml:ro
    expose: ["8080"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    logging: *bounded-logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 10

  postgres:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=20
    environment:
      POSTGRES_DB: ashare
      POSTGRES_USER: ashare
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    ports: ["${SERVICE_BIND_ADDRESS:-127.0.0.1}:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    logging: *bounded-logs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashare -d ashare"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
    ports: ["${SERVICE_BIND_ADDRESS:-127.0.0.1}:6379:6379"]
    volumes: ["redis-data:/data"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 64m
    logging: *bounded-logs
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  edge-acme-data:
  edge-certificates:
  postgres-data:
  redis-data:
  lake-data:
  object-data:
  private-data:
