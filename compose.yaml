services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports: ["${WEB_BIND_ADDRESS:-127.0.0.1}:80:80"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    command: ["sh", "-c", "ashare-ai migrate && ashare-ai api --host 0.0.0.0 --port 8000"]
    env_file: [.env, .env.docker]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["${SERVICE_BIND_ADDRESS:-127.0.0.1}:8000:8000"]
    volumes:
      - lake-data:/data/lake
      - object-data:/data/objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    command: ["python", "-m", "ashare_ai.orchestration.runner"]
    env_file: [.env, .env.docker]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - lake-data:/data/lake
      - object-data:/data/objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; from ashare_ai.core.config import get_settings; assert redis.Redis.from_url(get_settings().redis_url).ping()"]
      interval: 20s
      timeout: 5s
      retries: 5

  backtest-worker:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    command: ["python", "-m", "ashare_ai.orchestration.backtest_worker"]
    env_file: [.env, .env.docker]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - lake-data:/data/lake
      - object-data:/data/objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; from ashare_ai.core.config import get_settings; assert redis.Redis.from_url(get_settings().redis_url).ping()"]
      interval: 20s
      timeout: 5s
      retries: 5

  research-worker:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    command: ["python", "-m", "ashare_ai.orchestration.research_worker"]
    env_file: [.env, .env.docker]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - lake-data:/data/lake
      - object-data:/data/objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; from ashare_ai.core.config import get_settings; assert redis.Redis.from_url(get_settings().redis_url).ping()"]
      interval: 20s
      timeout: 5s
      retries: 5

  trade-plan-worker:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    command: ["python", "-m", "ashare_ai.orchestration.trade_plan_worker"]
    env_file: [.env, .env.docker]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - lake-data:/data/lake
      - object-data:/data/objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; from ashare_ai.core.config import get_settings; assert redis.Redis.from_url(get_settings().redis_url).ping()"]
      interval: 20s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ashare
      POSTGRES_USER: ashare
      POSTGRES_PASSWORD: ashare
    ports: ["${SERVICE_BIND_ADDRESS:-127.0.0.1}:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashare -d ashare"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${SERVICE_BIND_ADDRESS:-127.0.0.1}:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:9001:9001"
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      OBJECT_STORE_BUCKET: ashare-research
    volumes:
      - ./docker/minio-init.sh:/init/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/init/minio-init.sh"]
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
  lake-data:
  object-data:
