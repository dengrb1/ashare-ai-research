name: Build and publish

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io

jobs:
  quality:
    name: Test and static analysis
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Run Python checks
        run: |
          python -m ruff check .
          python -m mypy src
          python -m pytest tests/unit -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run web checks
        working-directory: web
        run: |
          npm ci
          npm test -- --run
          npm run build

  docker:
    name: Build ${{ matrix.image_name }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: application
            image_suffix: ""
            context: .
            file: docker/app.Dockerfile
          - image_name: web
            image_suffix: "-web"
            context: ./web
            file: ./web/Dockerfile
          - image_name: postgres
            image_suffix: "-postgres"
            context: .
            file: docker/postgres.Dockerfile
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.image_suffix }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  executable:
    name: Build ${{ matrix.platform }} executable
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            binary: ashare-ai
          - os: windows-2022
            platform: windows-x86_64
            binary: ashare-ai.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package and packaging tool
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]" "pyinstaller>=6.10,<7"

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm packaging/ashare-ai.spec

      - name: Smoke-test Linux executable
        if: matrix.platform == 'linux-x86_64'
        run: ./dist/ashare-ai --help

      - name: Smoke-test Windows executable
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: .\dist\ashare-ai.exe --help

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashare-ai-${{ matrix.platform }}-${{ github.sha }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    name: Build Windows native installer
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build native installer
        shell: pwsh
        run: .\windows\native-control-center\build.ps1

      - name: Smoke-test native CLI
        shell: pwsh
        run: .\windows\native-control-center\AshareAI.NativeControlCenter.Cli.exe --help

      - name: Write installer checksum
        shell: pwsh
        run: |
          $setup = Resolve-Path .\windows\native-control-center\dist\AshareAI-Setup.exe
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLowerInvariant()
          "$hash  AshareAI-Setup.exe" | Set-Content -Encoding ascii .\windows\native-control-center\dist\AshareAI-Setup.exe.sha256

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashare-ai-windows-native-installer-${{ github.sha }}
          path: |
            windows/native-control-center/dist/AshareAI-Setup.exe
            windows/native-control-center/dist/AshareAI-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

  linux-native-installer:
    name: Build Linux native Beta package
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build native package
        run: bash linux/native-control-center/build-package.sh

      - name: Smoke-test native installer entrypoint
        run: |
          archive=$(find linux/native-control-center/dist -name 'AshareAI-Linux-Native-Beta-v*.tar.gz' -print -quit)
          test -n "$archive"
          test -f "$archive.sha256"
          (cd "$(dirname "$archive")" && sha256sum --check "$(basename "$archive").sha256")
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          tar -xzf "$archive" -C "$stage"
          "$stage"/AshareAI-Linux-Native-Beta-v*/install.sh --help

      - name: Upload Linux native package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashare-ai-linux-native-installer-${{ github.sha }}
          path: |
            linux/native-control-center/dist/AshareAI-Linux-Native-Beta-v*.tar.gz
            linux/native-control-center/dist/AshareAI-Linux-Native-Beta-v*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, docker, executable, windows-installer, linux-native-installer]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download native installer assets
        uses: actions/download-artifact@v4
        with:
          pattern: ashare-ai-*-native-installer-${{ github.sha }}
          merge-multiple: true
          path: release-assets

      - name: Name Windows Beta installer for the release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mv release-assets/AshareAI-Setup.exe "release-assets/AshareAI-Windows-Native-Beta-${RELEASE_TAG}.exe"
          sha256sum "release-assets/AshareAI-Windows-Native-Beta-${RELEASE_TAG}.exe" > "release-assets/AshareAI-Windows-Native-Beta-${RELEASE_TAG}.exe.sha256"
          rm release-assets/AshareAI-Setup.exe.sha256

      - name: Publish Chinese release notes and native Beta installers
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.zh-CN.md
          files: release-assets/*
          generate_release_notes: false
