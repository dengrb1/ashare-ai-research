[package]
name = "ashare-model-gateway"
version = "0.2.0"
edition = "2024"
description = "OpenAI Chat Completions / Responses 双协议模型网关：多渠道路由、模型映射、Key 池、协议转换（参照 ccx）"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "macros"] }
bytes = "1.10"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
